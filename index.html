<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>손가현 — 프론트엔드 개발자</title>
    <meta name="description" content="문제 해결에 강한 프론트엔드 개발자 손가현의 포트폴리오 사이트입니다. React, TypeScript, Next.js 전문." />
    <meta name="keywords" content="프론트엔드 개발자, React, TypeScript, Next.js, 포트폴리오" />
    <meta name="author" content="손가현" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gildong.dev/" />
    <meta property="og:title" content="손가현 — 프론트엔드 개발자" />
    <meta property="og:description" content="문제 해결에 강한 프론트엔드 개발자 손가현의 포트폴리오 사이트입니다." />
    <meta property="og:image" content="https://gildong.dev/og-image.png" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="손가현 포트폴리오" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="손가현 — 프론트엔드 개발자" />
    <meta name="twitter:description" content="문제 해결에 강한 프론트엔드 개발자 손가현의 포트폴리오 사이트입니다." />
    <meta name="twitter:image" content="https://gildong.dev/og-image.png" />

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#030712" media="(prefers-color-scheme: dark)" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Dark mode FOUC prevention -->
    <script>
      ;(function () {
        const stored = localStorage.getItem('theme')
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
